basePath: /
definitions:
  domain.ErrorResponse:
    properties:
      error:
        example: Detailed error message here
        type: string
      status:
        example: error
        type: string
    type: object
  domain.FileMetadata:
    properties:
      mime_type:
        type: string
      size_in_bytes:
        type: integer
      status:
        type: string
    type: object
  domain.Match:
    properties:
      contact_target:
        description: email address or phone number
        type: string
      contact_type:
        description: '"email" or "whatsapp"'
        type: string
      index:
        type: integer
      reason:
        type: string
    type: object
  domain.ProcessResult:
    properties:
      bytes_processed:
        type: integer
      duration_ms:
        type: integer
      file:
        $ref: '#/definitions/domain.FileMetadata'
      items:
        items:
          type: string
        type: array
      items_processed:
        type: integer
      matches:
        description: matches detected by Gemini
        items:
          $ref: '#/definitions/domain.Match'
        type: array
      status:
        type: string
    type: object
  domain.Vacancy:
    properties:
      index:
        type: integer
      text:
        type: string
    type: object
  handler.matchRequest:
    properties:
      file_base64:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST em Go com Clean Architecture para processamento de textos,
    análise de currículos com Gemini e disparos automáticos.
  title: API Go de Processamento de Texto e Documentos
  version: "1.0"
paths:
  /api/v1/match:
    post:
      consumes:
      - application/json
      description: Recebe apenas o currículo do candidato em base64. Gera o embedding
        vetorial do currículo, executa a busca de similaridade rápida no banco local
        (chromem-go) e envia as vagas compatíveis para triagem detalhada via LLM (Gemini/DeepSeek),
        realizando também os disparos automáticos.
      parameters:
      - description: Payload contendo apenas o currículo base64
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.matchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Resultado da busca vetorial e envios automáticos
          schema:
            $ref: '#/definitions/domain.ProcessResult'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Erro ao extrair, buscar ou enviar candidaturas
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Executa match de currículo contra banco de vagas
      tags:
      - Processador
  /api/v1/vacancies:
    get:
      description: Retorna todas as vagas atualmente armazenadas no banco vetorial
        local (chromem-go).
      produces:
      - application/json
      responses:
        "200":
          description: Lista de vagas
          schema:
            items:
              $ref: '#/definitions/domain.Vacancy'
            type: array
        "500":
          description: Erro interno ao listar vagas
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Lista todas as vagas do banco vetorial
      tags:
      - Vagas
  /api/v1/vacancies/clear:
    post:
      description: Remove todas as vagas e coleções existentes no banco de dados local
        do chromem-go.
      produces:
      - application/json
      responses:
        "200":
          description: Banco vetorial de vagas limpo com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno ao limpar banco vetorial
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Limpa o banco de dados vetorial de vagas
      tags:
      - Vagas
swagger: "2.0"
